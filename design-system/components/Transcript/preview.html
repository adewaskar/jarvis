<!-- @dsCard group="Frame" height=260 subtitle="log, decode, caption, error" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap">
<style>
html,body{height:100%}body{margin:0;background:var(--bg)}
.log,.caption,.error,.suggest{position:static;transform:none;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:18px;padding:22px 24px;align-items:center}
</style>
</head>
<body>
<div class="hud" style="position:relative;inset:auto;--accent: var(--phase-speaking)">
  <div class="stack">
    <div class="log" style="width:min(760px,92%)">
      <div class="log-line log-user"><span class="log-who">YOU</span><span class="log-text">what happened in AI this week</span></div>
      <div class="log-line log-jarvis"><span class="log-who">JARVIS</span><span class="log-text">Three stories lead. Anthropic shipped a new model, the EU closed its consultation, and <span class="decode-ghost">#K7[=+%]Q3&lt;&gt;/\|{}</span><span class="decode-veil">a lab in Zurich published the paper everyone is arguing about.</span></span></div>
    </div>
    <div class="caption">take a screenshot of my phone</div>
    <div class="error">microphone permission denied in this window</div>
  </div>
</div>
</body>
</html>
