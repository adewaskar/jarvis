<!-- @dsCard group="Overlays" height=230 subtitle="the gesture legend" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap">
<style>html,body{height:100%}body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="hud" style="--accent: var(--interface)">
  <div class="gguide">
    <div class="gguide-head">GESTURES</div>
    <div class="gguide-row"><span class="gguide-icon">☝</span><span class="gguide-name">POINT</span><span class="gguide-does">move the pointer</span></div>
    <div class="gguide-row"><span class="gguide-icon">🤏</span><span class="gguide-name">PINCH</span><span class="gguide-does">focus a blade</span></div>
    <div class="gguide-row"><span class="gguide-icon">✊</span><span class="gguide-name">GRAB</span><span class="gguide-does">drag it</span></div>
    <div class="gguide-row"><span class="gguide-icon">👋</span><span class="gguide-name">WAVE</span><span class="gguide-does">close it</span></div>
    <div class="gguide-foot">gone once you have used each · <kbd>G</kbd> brings it back</div>
  </div>
</div>
</body>
</html>
