<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap">
<style>html,body{height:100%}body{margin:0;background:var(--bg)}.row{position:relative;height:60px}.tool-badge{top:10px;transform:translateX(-50%)}</style>
</head>
<body>
<div class="hud" style="position:relative;inset:auto;padding:8px 0">
  <div class="row" style="--accent: var(--phase-tooling)">
    <div class="tool-badge"><span class="tool-kicker"><span class="spinner"></span>RUNNING</span><span class="tool-name">web search</span></div>
  </div>
  <div class="row" style="--accent: var(--phase-tooling)">
    <div class="tool-badge"><span class="tool-kicker"><span class="spinner"></span>RUNNING</span><span class="tool-name">read gmail inbox and summarise unread</span></div>
  </div>
</div>
</body>
</html>
