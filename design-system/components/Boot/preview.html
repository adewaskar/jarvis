<!-- @dsCard group="Sequences" height=300 subtitle="beat 1: the status bar" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap">
<style>html,body{height:100%}body{margin:0;background:var(--bg)}.boot-bar{top:10%;padding:0 40px}</style>
</head>
<body>
<div class="boot" style="--accent: var(--phase-boot)">
  <div class="boot-bar">
    <div class="boot-bar-frame">
      <div class="boot-bar-title">INITIALISING<span class="boot-dots">...</span><span class="boot-cursor"></span></div>
      <div class="boot-seg">
        <span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell" data-on="1"></span><span class="boot-seg-cell"></span><span class="boot-seg-cell"></span><span class="boot-seg-cell"></span><span class="boot-seg-cell"></span><span class="boot-seg-cell"></span><span class="boot-seg-cell"></span>
      </div>
      <div class="boot-log">
        <div class="boot-log-line">bridge linked on localhost:8787</div>
        <div class="boot-log-line">wake word armed: hey jarvis</div>
        <div class="boot-log-line" style="animation-delay:.6s">loading speech model</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
